<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Single Page Apps for GitHub Pages</title>
  <script type="text/javascript">
    // 404 Redirection for HashRouter Support
    // This script detects deep links (e.g. /admin) that GitHub Pages 404s on,
    // and redirects them to the HashRouter equivalent (e.g. /#/admin).

    var l = window.location;

    // Dynamic Segment Count Logic (to support PR Previews in subdirectories)
    var segmentCount = 0;
    var pathSegments = l.pathname.split('/');
    if (pathSegments.length > 2 && pathSegments[1] === 'pr-preview') {
      segmentCount = 2; // Keep /pr-preview/pr-XX
    }

    var basePath = l.pathname.split('/').slice(0, 1 + segmentCount).join('/');
    var route = l.pathname.slice(1).split('/').slice(segmentCount).join('/');

    // Redirect to Hash URL
    // e.g. /pr-preview/pr-17/admin -> /pr-preview/pr-17/#/admin
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      basePath + '/#/' + route + l.search + l.hash
    );
  </script>
</head>

<body>
</body>

</html>
